version: "3.1"

nlu:
- intent: greet
  examples: |
    - xin chào
    - chào bạn
    - hello
    - hi
    - chào
    - xin chào bạn

- intent: goodbye
  examples: |
    - tạm biệt
    - bye
    - goodbye
    - hẹn gặp lại
    - cảm ơn

- intent: start_assessment
  examples: |
    - tôi muốn làm bài đánh giá
    - bắt đầu đánh giá
    - làm bài test
    - đánh giá nghề nghiệp
    - tôi muốn khám phá bản thân
    - làm bài kiểm tra

- intent: ask_about_assessment
  examples: |
    - bài đánh giá là gì
    - đánh giá có những gì
    - giải thích về đánh giá
    - tôi muốn biết về bài test
    - đánh giá có mấy phần

- intent: view_results
  examples: |
    - xem kết quả
    - kết quả đánh giá
    - tôi muốn xem điểm
    - kết quả của tôi
    - xem kết quả test

- intent: assessment_complete
  examples: |
    - tôi đã hoàn thành đánh giá
    - làm xong bài test
    - hoàn thành đánh giá
    - đã trả lời hết câu hỏi
    - kết thúc đánh giá

- intent: request_results
  examples: |
    - cho tôi xem kết quả
    - hiển thị kết quả
    - tôi muốn biết kết quả
    - xem điểm số
    - kết quả như thế nào

- intent: ask_help
  examples: |
    - giúp tôi
    - tôi cần trợ giúp
    - help
    - hướng dẫn
    - bạn có thể giúp gì

- intent: affirm
  examples: |
    - có
    - đúng
    - ok
    - được
    - yes
    - tôi đồng ý

- intent: deny
  examples: |
    - không
    - sai
    - no
    - không phải
    - tôi không muốn
