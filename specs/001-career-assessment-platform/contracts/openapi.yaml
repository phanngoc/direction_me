openapi: 3.0.3
info:
  title: MyWay Career Assessment Platform API
  description: API for career assessment platform integrating IQ, EQ, DQ, AQ evaluation and Ikigai philosophy
  version: 1.0.0
  contact:
    name: MyWay Development Team
    email: dev@myway.vn
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.myway.vn/v1
    description: Production server
  - url: https://staging-api.myway.vn/v1
    description: Staging server
  - url: http://localhost:8000/v1
    description: Development server

paths:
  # Authentication endpoints
  /auth/register:
    post:
      summary: Register new user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid input data
        '409':
          description: Email already exists

  /auth/login:
    post:
      summary: Login user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials

  /auth/refresh:
    post:
      summary: Refresh access token
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid or expired token

  # User profile endpoints
  /users/profile:
    get:
      summary: Get user profile
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized

    put:
      summary: Update user profile
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid input data
        '401':
          description: Unauthorized

  # Assessment endpoints
  /assessments/start:
    post:
      summary: Start new assessment session
      tags: [Assessments]
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Assessment session started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentSession'
        '401':
          description: Unauthorized

  /assessments/{session_id}/questions:
    get:
      summary: Get assessment questions for a module
      tags: [Assessments]
      security:
        - bearerAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: module
          in: query
          required: true
          schema:
            type: string
            enum: [IQ, EQ, DQ, AQ]
      responses:
        '200':
          description: Questions retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssessmentQuestion'
        '401':
          description: Unauthorized
        '404':
          description: Session not found

  /assessments/{session_id}/responses:
    post:
      summary: Submit assessment response
      tags: [Assessments]
      security:
        - bearerAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentResponse'
      responses:
        '201':
          description: Response submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResponse'
        '400':
          description: Invalid response data
        '401':
          description: Unauthorized

  /assessments/{session_id}/complete:
    post:
      summary: Complete assessment session
      tags: [Assessments]
      security:
        - bearerAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Assessment completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResult'
        '400':
          description: Assessment not ready for completion
        '401':
          description: Unauthorized

  # Results endpoints
  /results/{result_id}:
    get:
      summary: Get assessment results
      tags: [Results]
      security:
        - bearerAuth: []
      parameters:
        - name: result_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Results retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResult'
        '401':
          description: Unauthorized
        '404':
          description: Results not found

  /results/{result_id}/recommendations:
    get:
      summary: Get career recommendations
      tags: [Results]
      security:
        - bearerAuth: []
      parameters:
        - name: result_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Recommendations retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CareerRecommendation'
        '401':
          description: Unauthorized
        '404':
          description: Results not found

  # Learning roadmap endpoints
  /roadmap:
    get:
      summary: Get user learning roadmap
      tags: [Learning]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Roadmap retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LearningResource'
        '401':
          description: Unauthorized

  /roadmap/{resource_id}/start:
    post:
      summary: Start learning resource
      tags: [Learning]
      security:
        - bearerAuth: []
      parameters:
        - name: resource_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resource started successfully
        '401':
          description: Unauthorized
        '404':
          description: Resource not found

  /roadmap/{resource_id}/complete:
    post:
      summary: Mark learning resource as completed
      tags: [Learning]
      security:
        - bearerAuth: []
      parameters:
        - name: resource_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resource marked as completed
        '401':
          description: Unauthorized
        '404':
          description: Resource not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserRegistration:
      type: object
      required:
        - email
        - password
        - first_name
        - last_name
        - age
        - education_level
      properties:
        email:
          type: string
          format: email
          example: "student@example.com"
        password:
          type: string
          minLength: 8
          example: "securepassword123"
        first_name:
          type: string
          maxLength: 100
          example: "Nguyễn"
        last_name:
          type: string
          maxLength: 100
          example: "Văn A"
        age:
          type: integer
          minimum: 15
          maximum: 25
          example: 20
        education_level:
          type: string
          enum: [high_school, university, graduate]
          example: "university"
        field_of_study:
          type: string
          maxLength: 100
          example: "Công nghệ thông tin"

    UserLogin:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "student@example.com"
        password:
          type: string
          example: "securepassword123"

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refresh_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          example: "bearer"
        expires_in:
          type: integer
          example: 3600

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        email:
          type: string
          format: email
          example: "student@example.com"
        first_name:
          type: string
          example: "Nguyễn"
        last_name:
          type: string
          example: "Văn A"
        age:
          type: integer
          example: 20
        education_level:
          type: string
          example: "university"
        field_of_study:
          type: string
          example: "Công nghệ thông tin"
        created_at:
          type: string
          format: date-time
          example: "2025-10-25T10:00:00Z"

    UserProfileUpdate:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 100
          example: "Nguyễn"
        last_name:
          type: string
          maxLength: 100
          example: "Văn A"
        age:
          type: integer
          minimum: 15
          maximum: 25
          example: 20
        education_level:
          type: string
          enum: [high_school, university, graduate]
          example: "university"
        field_of_study:
          type: string
          maxLength: 100
          example: "Công nghệ thông tin"

    AssessmentSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        user_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        status:
          type: string
          enum: [in_progress, completed, abandoned]
          example: "in_progress"
        started_at:
          type: string
          format: date-time
          example: "2025-10-25T10:00:00Z"
        completed_at:
          type: string
          format: date-time
          example: "2025-10-25T10:45:00Z"
        total_time_minutes:
          type: integer
          example: 45

    AssessmentQuestion:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        module:
          type: string
          enum: [IQ, EQ, DQ, AQ]
          example: "IQ"
        question_text:
          type: string
          example: "Bạn thích giải quyết vấn đề như thế nào?"
        question_type:
          type: string
          enum: [multiple_choice, scale, scenario]
          example: "multiple_choice"
        options:
          type: array
          items:
            type: string
          example: ["Rất thích", "Thích", "Bình thường", "Không thích"]
        weight:
          type: number
          format: float
          example: 1.0

    AssessmentResponse:
      type: object
      required:
        - question_id
        - answer
      properties:
        question_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        answer:
          type: string
          maxLength: 500
          example: "Rất thích"
        score:
          type: number
          format: float
          example: 85.5

    AssessmentResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        user_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        iq_score:
          type: number
          format: float
          example: 85.5
        eq_score:
          type: number
          format: float
          example: 78.2
        dq_score:
          type: number
          format: float
          example: 92.1
        aq_score:
          type: number
          format: float
          example: 88.7
        iq_percentile:
          type: number
          format: float
          example: 85.5
        eq_percentile:
          type: number
          format: float
          example: 78.2
        dq_percentile:
          type: number
          format: float
          example: 92.1
        aq_percentile:
          type: number
          format: float
          example: 88.7
        ikigai_love:
          type: number
          format: float
          example: 85.0
        ikigai_good_at:
          type: number
          format: float
          example: 90.0
        ikigai_world_needs:
          type: number
          format: float
          example: 80.0
        ikigai_paid_for:
          type: number
          format: float
          example: 75.0
        strongest_quotient:
          type: string
          enum: [IQ, EQ, DQ, AQ]
          example: "DQ"
        weakest_quotient:
          type: string
          enum: [IQ, EQ, DQ, AQ]
          example: "EQ"
        created_at:
          type: string
          format: date-time
          example: "2025-10-25T10:45:00Z"

    CareerRecommendation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        career_title:
          type: string
          example: "Lập trình viên Full-stack"
        career_description:
          type: string
          example: "Phát triển ứng dụng web và mobile với các công nghệ hiện đại"
        alignment_score:
          type: number
          format: float
          example: 92.5
        required_skills:
          type: array
          items:
            type: string
          example: ["JavaScript", "React", "Node.js", "Python"]
        market_demand:
          type: string
          enum: [high, medium, low]
          example: "high"
        salary_range_min:
          type: integer
          example: 15000000
        salary_range_max:
          type: integer
          example: 35000000
        priority_rank:
          type: integer
          example: 1
        explanation:
          type: string
          example: "Dựa trên kết quả đánh giá, bạn có khả năng tư duy logic cao và khả năng thích nghi tốt, phù hợp với nghề lập trình viên"

    LearningResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        title:
          type: string
          example: "Khóa học JavaScript từ cơ bản đến nâng cao"
        description:
          type: string
          example: "Học JavaScript từ cơ bản đến nâng cao với các dự án thực tế"
        resource_type:
          type: string
          enum: [course, book, project, community]
          example: "course"
        platform:
          type: string
          example: "Coursera"
        url:
          type: string
          format: uri
          example: "https://coursera.org/learn/javascript"
        target_quotient:
          type: string
          enum: [IQ, EQ, DQ, AQ]
          example: "DQ"
        skill_tags:
          type: array
          items:
            type: string
          example: ["JavaScript", "Web Development", "Programming"]
        difficulty_level:
          type: string
          enum: [beginner, intermediate, advanced]
          example: "intermediate"
        cost:
          type: number
          format: float
          example: 500000.0
        is_free:
          type: boolean
          example: false

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Invalid input data"
        message:
          type: string
          example: "The provided data does not meet the requirements"
        details:
          type: object
          additionalProperties: true
