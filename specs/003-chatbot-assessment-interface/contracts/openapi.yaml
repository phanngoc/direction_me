openapi: 3.0.3
info:
  title: Chatbot Assessment Interface API
  description: API for chatbot-driven career assessment platform with conversation management and results visualization
  version: 1.0.0
  contact:
    name: MyWay Development Team
    email: dev@myway.vn
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.myway.vn/v1
    description: Production server
  - url: https://staging-api.myway.vn/v1
    description: Staging server
  - url: http://localhost:8000/v1
    description: Development server

paths:
  # Chatbot endpoints
  /chatbot/sessions:
    post:
      summary: Start new chatbot session
      tags: [Chatbot]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatbotSessionStart'
      responses:
        '201':
          description: Chatbot session started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatbotSession'
        '400':
          description: Invalid input data

  /chatbot/sessions/{session_id}/messages:
    post:
      summary: Send message to chatbot
      tags: [Chatbot]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatbotMessage'
      responses:
        '200':
          description: Message processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatbotResponse'
        '400':
          description: Invalid message
        '404':
          description: Session not found

  /chatbot/sessions/{session_id}/messages:
    get:
      summary: Get conversation history
      tags: [Chatbot]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Conversation history retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatbotMessage'
        '404':
          description: Session not found

  # Assessment endpoints
  /assessments/start:
    post:
      summary: Start assessment from chatbot session
      tags: [Assessments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentStart'
      responses:
        '201':
          description: Assessment session started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentSession'
        '400':
          description: Invalid request

  /assessments/{session_id}/questions:
    get:
      summary: Get assessment questions for a module
      tags: [Assessments]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: module
          in: query
          required: true
          schema:
            type: string
            enum: [IQ, EQ, DQ, AQ]
      responses:
        '200':
          description: Questions retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssessmentQuestion'
        '404':
          description: Session not found

  /assessments/{session_id}/responses:
    post:
      summary: Submit assessment response
      tags: [Assessments]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentResponse'
      responses:
        '201':
          description: Response submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResponse'
        '400':
          description: Invalid response data

  /assessments/{session_id}/complete:
    post:
      summary: Complete assessment session
      tags: [Assessments]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Assessment completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResult'
        '400':
          description: Assessment not ready for completion

  # Results endpoints
  /results/{result_id}:
    get:
      summary: Get assessment results
      tags: [Results]
      parameters:
        - name: result_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Results retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResult'
        '404':
          description: Results not found

  /results/{result_id}/visualizations:
    get:
      summary: Get visualization data
      tags: [Results]
      parameters:
        - name: result_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: chart_type
          in: query
          schema:
            type: string
            enum: [radar, facet_bars, ikigai_map]
      responses:
        '200':
          description: Visualization data retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisualizationData'
        '404':
          description: Results not found

  /results/{result_id}/recommendations:
    get:
      summary: Get career recommendations
      tags: [Results]
      parameters:
        - name: result_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Recommendations retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CareerRecommendation'
        '404':
          description: Results not found

  # WebSocket endpoints
  /chatbot/ws/{session_id}:
    get:
      summary: WebSocket connection for real-time chatbot
      tags: [Chatbot]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '101':
          description: WebSocket connection established
        '400':
          description: Invalid session

components:
  schemas:
    ChatbotSessionStart:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        initial_message:
          type: string
          example: "Xin chào, tôi muốn làm bài đánh giá nghề nghiệp"

    ChatbotSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        user_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        session_token:
          type: string
          example: "sess_abc123def456"
        status:
          type: string
          enum: [active, completed, abandoned]
          example: "active"
        current_intent:
          type: string
          example: "greeting"
        assessment_ready:
          type: boolean
          example: false
        started_at:
          type: string
          format: date-time
          example: "2025-10-25T10:00:00Z"

    ChatbotMessage:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          example: "Tôi muốn bắt đầu làm bài đánh giá"
        message_type:
          type: string
          enum: [text, quick_reply]
          example: "text"

    ChatbotResponse:
      type: object
      properties:
        message:
          type: string
          example: "Chào bạn! Tôi sẽ hướng dẫn bạn làm bài đánh giá nghề nghiệp."
        message_type:
          type: string
          enum: [text, quick_reply, assessment_redirect, results]
          example: "text"
        quick_replies:
          type: array
          items:
            type: string
          example: ["Bắt đầu đánh giá", "Tìm hiểu thêm", "Xem kết quả"]
        intent:
          type: string
          example: "start_assessment"
        entities:
          type: object
          additionalProperties: true
        confidence:
          type: number
          format: float
          example: 0.95

    AssessmentStart:
      type: object
      required:
        - chatbot_session_id
      properties:
        chatbot_session_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"

    AssessmentSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        user_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        chatbot_session_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        status:
          type: string
          enum: [in_progress, completed, abandoned]
          example: "in_progress"
        started_at:
          type: string
          format: date-time
          example: "2025-10-25T10:00:00Z"
        completed_at:
          type: string
          format: date-time
          example: "2025-10-25T10:45:00Z"
        total_time_minutes:
          type: integer
          example: 45

    AssessmentQuestion:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        module:
          type: string
          enum: [IQ, EQ, DQ, AQ]
          example: "IQ"
        facet:
          type: string
          example: "Logical Reasoning"
        question_text:
          type: string
          example: "Nếu tất cả M đều là N. Một số N là P. Kết luận nào chắc chắn đúng?"
        question_type:
          type: string
          enum: [multiple_choice, likert_scale]
          example: "multiple_choice"
        options:
          type: array
          items:
            type: string
          example: ["A. Một số M là P", "B. Không M nào là P", "C. Một số P là M", "D. Không kết luận nào chắc chắn đúng"]
        correct_answer:
          type: string
          example: "D"
        reverse_scored:
          type: boolean
          example: false
        difficulty:
          type: integer
          example: 2
        weight:
          type: number
          format: float
          example: 1.0

    AssessmentResponse:
      type: object
      required:
        - question_id
        - answer
      properties:
        question_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        answer:
          type: string
          example: "D"
        answer_value:
          type: integer
          example: 4
        response_time_seconds:
          type: integer
          example: 30

    AssessmentResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        user_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        chatbot_session_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        iq_score:
          type: number
          format: float
          example: 85.5
        eq_score:
          type: number
          format: float
          example: 78.2
        dq_score:
          type: number
          format: float
          example: 92.1
        aq_score:
          type: number
          format: float
          example: 88.7
        iq_percentile:
          type: number
          format: float
          example: 85.5
        eq_percentile:
          type: number
          format: float
          example: 78.2
        dq_percentile:
          type: number
          format: float
          example: 92.1
        aq_percentile:
          type: number
          format: float
          example: 88.7
        ikigai_love:
          type: number
          format: float
          example: 85.0
        ikigai_good_at:
          type: number
          format: float
          example: 90.0
        ikigai_world_needs:
          type: number
          format: float
          example: 80.0
        ikigai_paid_for:
          type: number
          format: float
          example: 75.0
        strongest_quotient:
          type: string
          enum: [IQ, EQ, DQ, AQ]
          example: "DQ"
        weakest_quotient:
          type: string
          enum: [IQ, EQ, DQ, AQ]
          example: "EQ"
        consistency_score:
          type: number
          format: float
          example: 0.85
        quality_flags:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
          example: "2025-10-25T10:45:00Z"

    VisualizationData:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        result_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        chart_type:
          type: string
          enum: [radar, facet_bars, ikigai_map]
          example: "radar"
        chart_data:
          type: object
          additionalProperties: true
        facet_scores:
          type: object
          additionalProperties: true
        ikigai_intersections:
          type: object
          additionalProperties: true

    CareerRecommendation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        career_title:
          type: string
          example: "Lập trình viên Full-stack"
        career_description:
          type: string
          example: "Phát triển ứng dụng web và mobile với các công nghệ hiện đại"
        alignment_score:
          type: number
          format: float
          example: 92.5
        required_skills:
          type: array
          items:
            type: string
          example: ["JavaScript", "React", "Node.js", "Python"]
        market_demand:
          type: string
          enum: [high, medium, low]
          example: "high"
        salary_range_min:
          type: integer
          example: 15000000
        salary_range_max:
          type: integer
          example: 35000000
        priority_rank:
          type: integer
          example: 1
        explanation:
          type: string
          example: "Dựa trên kết quả đánh giá, bạn có khả năng tư duy logic cao và khả năng thích nghi tốt, phù hợp với nghề lập trình viên"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Invalid input data"
        message:
          type: string
          example: "The provided data does not meet the requirements"
        details:
          type: object
          additionalProperties: true
